<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <!-- Skin Tone Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2a177" />
      <stop offset="60%" stop-color="#d08b5e" />
      <stop offset="100%" stop-color="#b87245" />
    </linearGradient>

    <linearGradient id="skinLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed0b8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d08b5e" stop-opacity="0" />
    </linearGradient>

    <!-- Terracotta Orange Shirt -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db5a3a" />
      <stop offset="50%" stop-color="#c6472b" />
      <stop offset="100%" stop-color="#9d3119" />
    </linearGradient>

    <!-- Gold Pendant -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <clipPath id="avatarCircle">
      <circle cx="400" cy="400" r="396" />
    </clipPath>
  </defs>

  <g clip-path="url(#avatarCircle)">
    <!-- Dark Neutral Studio Background -->
    <rect width="800" height="800" fill="url(#bgGlow)" />
    <circle cx="400" cy="400" r="350" fill="#171717" opacity="0.6" />

    <!-- PORTRAIT OF VIKASH RITIK (VRvlogar) -->
    <g transform="translate(0, 20)">
      <!-- Torso / Terracotta Orange Shirt -->
      <path d="M 120 780 C 140 600 230 460 380 435 C 490 415 650 435 750 490 C 820 530 850 670 850 780 Z" fill="url(#shirtGrad)" />

      <!-- Left Chest Printed Cartoon Logo -->
      <g transform="translate(560, 500) scale(0.85)">
        <circle cx="25" cy="25" r="18" fill="#e0f2fe" />
        <path d="M 15 15 Q 25 8 35 15 L 38 22 L 12 22 Z" fill="#0284c7" />
        <circle cx="20" cy="26" r="3.5" fill="#000" />
        <circle cx="30" cy="26" r="3.5" fill="#000" />
        <path d="M 18 32 Q 25 37 32 32" stroke="#000" stroke-width="2" fill="none" />
        <text x="25" y="55" font-family="sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">VR</text>
      </g>

      <!-- Right Arm Pulling Shirt Across / Smartwatch -->
      <path d="M 270 700 C 280 620 360 640 470 640 C 570 640 610 700 570 780 L 250 780 Z" fill="url(#skin)" />

      <!-- Black Smartwatch -->
      <g transform="translate(425, 630) rotate(-12)">
        <rect x="-32" y="-16" width="64" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="2.5" />
        <circle cx="0" cy="0" r="20" fill="#030712" stroke="#4b5563" stroke-width="1.5" />
        <circle cx="0" cy="0" r="15" fill="#1f2937" />
        <line x1="0" y1="0" x2="7" y2="-5" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Neck -->
      <path d="M 330 360 Q 400 420 470 360 L 480 440 Q 400 490 320 440 Z" fill="url(#skin)" />
      <!-- Collar -->
      <path d="M 320 385 Q 400 445 480 385" stroke="#9d3119" stroke-width="14" fill="none" stroke-linecap="round" />

      <!-- Red Thread Necklace -->
      <path d="M 335 390 Q 400 450 465 390" stroke="#dc2626" stroke-width="3.5" fill="none" />

      <!-- Gold Heart Pendant -->
      <g transform="translate(400, 440)">
        <path d="M 0 -7 C -5 -14 -14 -9 -14 0 C -14 9 -2 16 0 20 C 2 16 14 9 14 0 C 14 -9 5 -14 0 -7 Z" fill="url(#gold)" stroke="#b45309" stroke-width="1.2" />
      </g>

      <!-- Head Base -->
      <path d="M 295 250 C 285 350 335 415 400 415 C 465 415 515 350 505 250 C 495 170 305 170 295 250 Z" fill="url(#skin)" />

      <!-- Face Highlight -->
      <path d="M 330 240 C 330 180 400 175 430 185 C 380 190 340 220 330 240 Z" fill="url(#skinLight)" />

      <!-- Ears -->
      <ellipse cx="290" cy="285" rx="18" ry="25" fill="#cb8153" />
      <ellipse cx="510" cy="285" rx="18" ry="25" fill="#cb8153" />

      <!-- Styled Dark Hair -->
      <path d="M 275 240 C 265 160 325 95 400 95 C 475 95 525 150 515 230 C 485 190 440 180 395 180 C 345 180 305 200 275 240 Z" fill="#0f172a" />
      <path d="M 285 205 C 315 130 380 110 435 120 C 495 130 525 180 505 215 C 465 150 395 150 315 190 Z" fill="#1e293b" />
      <path d="M 320 180 C 360 145 430 145 475 175 C 430 155 375 155 320 180 Z" fill="#334155" />

      <!-- Eyebrows -->
      <path d="M 320 258 Q 352 245 380 258" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M 420 258 Q 448 245 480 258" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none" />

      <!-- Eyes -->
      <ellipse cx="352" cy="278" rx="16" ry="11" fill="#ffffff" />
      <circle cx="354" cy="278" r="8.5" fill="#1c1917" />
      <circle cx="354" cy="278" r="4.5" fill="#44403c" />
      <circle cx="356" cy="276" r="2.5" fill="#ffffff" />

      <ellipse cx="448" cy="278" rx="16" ry="11" fill="#ffffff" />
      <circle cx="446" cy="278" r="8.5" fill="#1c1917" />
      <circle cx="446" cy="278" r="4.5" fill="#44403c" />
      <circle cx="444" cy="276" r="2.5" fill="#ffffff" />

      <!-- Nose -->
      <path d="M 398 270 Q 407 310 390 320 Q 400 326 410 320" stroke="#a1582f" stroke-width="4.5" stroke-linecap="round" fill="none" />

      <!-- Mustache -->
      <path d="M 360 338 Q 400 330 440 338 C 422 346 378 346 360 338 Z" fill="#1c1917" />

      <!-- Smile -->
      <path d="M 358 348 Q 400 380 442 348" stroke="#7c2d12" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M 366 350 Q 400 375 434 350 C 420 366 380 366 366 350 Z" fill="#ffffff" />

      <!-- Chin -->
      <path d="M 370 390 Q 400 402 430 390" stroke="#a1582f" stroke-width="3" fill="none" />
    </g>
  </g>
</svg>
